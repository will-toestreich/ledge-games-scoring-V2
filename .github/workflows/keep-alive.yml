name: Keep Supabase awake

# Free-tier Supabase projects pause after ~7 days without API activity.
# One trivial read twice a week resets that clock. If a run fails (project
# paused anyway, key rotated), the red ✗ on the Actions tab is the signal.
#
# Note: GitHub suspends scheduled workflows in repos with no commits for
# 60 days (it emails a warning first) — any push resets that. Keep the
# morning-of "open the app" check in the event-day runbook regardless.

on:
  schedule:
    - cron: "17 9 * * 1,4" # Mondays and Thursdays, 09:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query one row so the project registers activity
        run: |
          curl -sf --max-time 30 \
            "$SUPABASE_URL/rest/v1/v2_app_state?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -o /dev/null
          echo "Supabase answered — inactivity clock reset."
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
