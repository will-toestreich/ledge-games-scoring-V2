<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/brand/The-Ledge-Games-Icon-1.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08080c" />
    <title>The Ledge Games</title>
    <script>
      // Apply the saved theme before first paint so light-mode users don't
      // get a dark flash (React re-applies it on mount).
      try {
        var t = localStorage.getItem("ledge-theme");
        if (t === "light" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
          document.documentElement.style.colorScheme = t;
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
